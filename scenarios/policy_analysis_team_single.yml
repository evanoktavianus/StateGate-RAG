# Policy analysis B, team task, as one document. The tables follow the part-1 rows of
# the group version of the workflow; nothing here comes from the engine.
name: Policy analysis B, team task (single document)
workflows: [policy_analysis_team_single]
people:
  lead:  { org: O1, unit: U1, positions: [leadership] }
  chair: { org: O1, unit: U1, groups: [g1] }
  m1:    { org: O1, unit: U1, groups: [g1] }
  gh:    { org: O1, unit: U1, groups: [g1], positions: [group_head] }
  fil:   { org: O1, unit: U1, positions: [filing] }
  staff: { org: O1, unit: U1 }
workspaces: { w: { org: O1 } }
steps:
  - add_document: { id: d, workspace: w, owner: chair, workflow: policy_analysis_team_single, creator: lead, assign: { chair: [chair], team: [m1] }, attrs: { group: g1 } }
  - expect_refused: { step: { add_document: { id: x, workspace: w, owner: chair, workflow: policy_analysis_team_single, creator: staff, assign: { chair: [chair], team: [m1] }, attrs: { group: g1 } } }, reason: not_permitted }
  - upload: { doc: d, by: m1 }
  - expect_refused: { step: { act: { doc: d, by: staff, action: upload } }, reason: not_permitted }
  # the whole team sees every draft, the group head and others nothing yet
  - expect_access:
      docs: { D: d }
      table: { chair: D, m1: D, gh: "", lead: "", fil: "", staff: "" }
      versions: { D: 2 }
  - act: { doc: d, by: chair, action: submit_for_review }
  - expect_access:
      docs: { D: d }
      table: { chair: D, m1: D, gh: D, lead: "", fil: "", staff: "" }
      versions: { D: 2 }
  - expect_refused: { step: { act: { doc: d, by: m1, action: upload } }, reason: not_accepted }   # the compiled version is fixed while reviewed
  - act: { doc: d, by: gh, action: pass_to_leadership }
  - expect_access:
      docs: { D: d }
      table: { chair: D, m1: D, gh: D, lead: D, fil: "", staff: "" }
  - expect_refused: { step: { act: { doc: d, by: gh, action: return } }, reason: not_permitted }
  - expect_refused: { step: { act: { doc: d, by: chair, action: return } }, reason: not_permitted }
  - act: { doc: d, by: lead, action: return }
  - expect_state: { doc: d, state: working_document }
  - expect_access:
      docs: { D: d }
      table: { chair: D, m1: D, gh: "", lead: "", fil: "", staff: "" }
      versions: { D: 2 }
  - act: { doc: d, by: m1, action: upload }
  - act: { doc: d, by: chair, action: submit_for_review }
  - act: { doc: d, by: gh, action: pass_to_leadership }
  - expect_access:
      docs: { D: d }
      table: { chair: D, m1: D, gh: D, lead: D, fil: "", staff: "" }
      versions: { D: 3 }
  - act: { doc: d, by: chair, action: hand_over }
  - expect_access:
      docs: { D: d }
      table: { chair: D, m1: D, gh: D, lead: D, fil: D, staff: "" }
