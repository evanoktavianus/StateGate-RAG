[project]
name = "stategate"
version = "0.1.0"
license = {text = "Apache-2.0"}
description = "StateGate: document workflows as state machines that decide who can read which version"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]
api = ["fastapi>=0.143,<1", "uvicorn>=0.54,<1"]
db = ["psycopg>=3.3,<4"]
eval = ["numpy>=1.26", "pytest>=8", "httpx>=0.28", "psycopg>=3.3,<4", "fastapi>=0.143,<1", "uvicorn>=0.54,<1"]  # what the evaluation in eval/evalkit/ needs

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "eval"]
testpaths = ["tests"]

[tool.setuptools.package-data]
docflow = ["stores/migrations/*.sql", "stores/*.sql", "agent_harness/*.txt"]
